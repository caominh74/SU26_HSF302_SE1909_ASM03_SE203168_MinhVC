<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parking Sessions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Parking Sessions</h1>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/ParkingSessions/create}" class="btn btn-primary">Create New Session</a>
        <form th:action="@{/ParkingSessions/index}" method="get" class="d-flex">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                   placeholder="License plate, slot, or status">
            <button type="submit" class="btn btn-outline-primary ms-2">Search</button>
            <a th:href="@{/ParkingSessions/index}" class="btn btn-outline-secondary ms-2">Clear</a>
        </form>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Session ID</th>
            <th>Vehicle</th>
            <th>Slot</th>
            <th>Entry Time</th>
            <th>Exit Time</th>
            <th>Status</th>
            <th>Estimated Fee</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="parkingSession : ${parkingSessions}">
            <td th:text="${parkingSession.id}"></td>
            <td th:text="${parkingSession.vehicleID != null ? parkingSession.vehicleID.licensePlate : ''}"></td>
            <td th:text="${parkingSession.slotID != null ? parkingSession.slotID.slotCode : ''}"></td>
            <td th:text="${parkingSession.entryTime}"></td>
            <td th:text="${parkingSession.exitTime}"></td>
            <td th:text="${parkingSession.status}"></td>
            <td th:text="${parkingSession.estimatedFee}"></td>
            <td>
                <a th:href="@{'/ParkingSessions/detail/' + ${parkingSession.id}}" class="btn btn-info btn-sm">View</a>
                <a th:href="@{'/ParkingSessions/update/' + ${parkingSession.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/ParkingSessions/delete/' + ${parkingSession.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
