<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parking Sessions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Parking Sessions</h1>
    <a th:href="@{/CreateParkingSessions/create}" class="btn btn-primary mb-3">Create New Session</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Session ID</th>
            <th>Vehicle</th>
            <th>Slot</th>
            <th>Entry Time</th>
            <th>Exit Time</th>
            <th>Status</th>
            <th>Estimated Fee</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="session : ${sessions}">
            <td th:text="${session.id}"></td>
            <td th:text="${session.vehicleID != null ? session.vehicleID.licensePlate : ''}"></td>
            <td th:text="${session.slotID != null ? session.slotID.slotCode : ''}"></td>
            <td th:text="${session.entryTime}"></td>
            <td th:text="${session.exitTime}"></td>
            <td th:text="${session.status}"></td>
            <td th:text="${session.estimatedFee}"></td>
            <td>
                <a th:href="@{'/CreateParkingSessions/view/' + ${session.id}}" class="btn btn-info btn-sm">View</a>
                <a th:href="@{'/CreateParkingSessions/edit/' + ${session.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/CreateParkingSessions/delete/' + ${session.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
