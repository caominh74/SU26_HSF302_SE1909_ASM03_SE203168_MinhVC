<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Parking Session</title>
    <link rel="stylesheet" th:href="@{/bootstrap-4.5.3-dist/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container mt-4">
    <h1>Create Parking Session</h1>
    <form th:action="@{/CreateParkingSessions/save}" th:object="${parkingSession}" method="post">
        <div class="mb-3">
            <label for="vehicleID" class="form-label">Vehicle</label>
            <select class="form-select" id="vehicleID" th:field="*{vehicleID}" required>
                <option value="">Select Vehicle</option>
                <option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.licensePlate}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="slotID" class="form-label">Parking Slot</label>
            <select class="form-select" id="slotID" th:field="*{slotID}" required>
                <option value="">Select Slot</option>
                <option th:each="s : ${slots}" th:value="${s.id}" th:text="${s.slotCode}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="entryTime" class="form-label">Entry Time</label>
            <input type="datetime-local" class="form-control" id="entryTime" th:field="*{entryTime}" required/>
        </div>
        <div class="mb-3">
            <label for="entryGate" class="form-label">Entry Gate</label>
            <input type="text" class="form-control" id="entryGate" th:field="*{entryGate}"/>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" th:field="*{status}" required>
                <option value="Active">Active</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="estimatedFee" class="form-label">Estimated Fee</label>
            <input type="number" step="0.01" class="form-control" id="estimatedFee" th:field="*{estimatedFee}"/>
        </div>
        <div class="mb-3">
            <label for="createdBy" class="form-label">Created By</label>
            <select class="form-select" id="createdBy" th:field="*{createdBy}">
                <option value="">Select User</option>
                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/CreateParkingSessions/index}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
