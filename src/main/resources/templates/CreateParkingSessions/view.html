<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>View Parking Session Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h2 class="text-secondary fw-bold m-0">Parking Session Details</h2>
            <small class="text-muted">View details of a specific parking session</small>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <!-- Null check wrapper around elements using parkingSession to prevent rendering crash -->
                <div th:if="${parkingSession != null}">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Session ID: <span th:text="${parkingSession.id}"></span></h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered mb-0">
                            <tbody>
                            <tr>
                                <th style="width: 200px;">Session ID</th>
                                <td th:text="${parkingSession.id}"></td>
                            </tr>
                            <tr>
                                <th>Vehicle License Plate</th>
                                <td th:text="${parkingSession.vehicleID != null ? parkingSession.vehicleID.licensePlate : ''}"></td>
                            </tr>
                            <tr>
                                <th>Parking Slot Code</th>
                                <td th:text="${parkingSession.slotID != null ? parkingSession.slotID.slotCode : ''}"></td>
                            </tr>
                            <tr>
                                <th>Entry Time</th>
                                <td th:text="${parkingSession.entryTime}"></td>
                            </tr>
                            <tr>
                                <th>Exit Time</th>
                                <td th:text="${parkingSession.exitTime}"></td>
                            </tr>
                            <tr>
                                <th>Entry Gate</th>
                                <td th:text="${parkingSession.entryGate}"></td>
                            </tr>
                            <tr>
                                <th>Exit Gate</th>
                                <td th:text="${parkingSession.exitGate}"></td>
                            </tr>
                            <tr>
                                <th>Status</th>
                                <td>
                                    <span th:text="${parkingSession.status}"
                                          th:classappend="${parkingSession.status == 'COMPLETED'} ? 'bg-success' : 'bg-warning'"
                                          class="badge rounded-pill px-3 py-2 text-dark">
                                    </span>
                                </td>
                            </tr>
                            <tr>
                                <th>Estimated Fee</th>
                                <td th:text="${parkingSession.estimatedFee != null ? '$' + parkingSession.estimatedFee : 'N/A'}"></td>
                            </tr>
                            <tr>
                                <th>Final Fee</th>
                                <td th:text="${parkingSession.finalFee != null ? '$' + parkingSession.finalFee : 'N/A'}"></td>
                            </tr>
                            <tr>
                                <th>Created By</th>
                                <td th:text="${parkingSession.createdBy != null ? parkingSession.createdBy.fullName : 'N/A'}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer text-center">
                        <a th:href="@{'/CreateParkingSessions/edit/' + ${parkingSession.id}}" class="btn btn-warning">Edit</a>
                        <a th:href="@{/CreateParkingSessions/index}" class="btn btn-secondary">Back to List</a>
                    </div>
                </div>

                <!-- Safe warning fallback if session is null -->
                <div th:if="${parkingSession == null}" class="card-body">
                    <div class="alert alert-warning mb-0">
                        Parking Session not found.
                    </div>
                    <div class="mt-3 text-center">
                        <a th:href="@{/CreateParkingSessions/index}" class="btn btn-secondary">Back to List</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
